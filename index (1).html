<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trade with Munaaf - Free VIP Telegram Channel</title>
  <meta name="description" content="Join India's Most Accurate Stock Market Community - Trade with Munaaf">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #080c14;
      --card-bg: rgba(18, 25, 38, 0.85);
      --card-border: rgba(34, 197, 94, 0.25);
      --accent-green: #00e676;
      --accent-green-dark: #00b050;
      --accent-glow: rgba(0, 230, 118, 0.4);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --gold: #f59e0b;
      --danger: #ef4444;
      --tg-blue: #229ED9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #030712;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Fixed Canvas Background */
    #chartCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.22;
    }

    /* 430px Ultra-Compact Mobile Container */
    .mobile-frame {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: radial-gradient(circle at top, #111a2e 0%, #080c14 65%);
      position: relative;
      z-index: 1;
      padding: 16px 14px 90px 14px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
    }

    /* Top Quick Status Pill */
    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid rgba(0, 230, 118, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-green);
      margin: 0 auto 12px auto;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      animation: pulseLive 1.5s infinite;
    }

    @keyframes pulseLive {
      0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
      70% { box-shadow: 0 0 0 7px rgba(0, 230, 118, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
    }

    /* Header & Logo Section */
    .header-card {
      text-align: center;
      position: relative;
      margin-bottom: 12px;
    }

    .logo-wrapper {
      position: relative;
      width: 84px;
      height: 84px;
      margin: 0 auto 10px auto;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-green);
      box-shadow: 0 0 20px var(--accent-glow);
      background: #0f172a;
    }

    .verified-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #2563eb;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border: 2px solid #080c14;
    }

    .channel-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 40%, #00e676 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .channel-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Stats Ribbon */
    .stats-ribbon {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: rgba(15, 23, 42, 0.7);
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 14px;
      text-align: center;
    }

    .stat-item h4 {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    .stat-item p {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Urgency Countdown Box */
    .timer-container {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 14px;
      padding: 10px 12px;
      text-align: center;
      margin-bottom: 14px;
    }

    .timer-title {
      font-size: 11px;
      color: #fca5a5;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .countdown-display {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
